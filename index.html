<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzguru">
<meta name="description" content="Mobilfunk-Rückzahlungen tracken und mit dem DKB-Kontoauszug abgleichen. Läuft offline, Daten bleiben lokal.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
<title>Finanzguru</title>
</head>
<body>
<div class="app" id="app">
  <main class="screens">
    <section class="screen active" id="screen-dashboard"></section>
    <section class="screen" id="screen-people"></section>
    <section class="screen" id="screen-ledger"></section>
    <section class="screen" id="screen-import"></section>
    <section class="screen" id="screen-costs"></section>
    <section class="screen" id="screen-more"></section>
  </main>

  <nav class="nav">
    <button id="nav-dashboard" class="active" onclick="showScreen('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      <span>Übersicht</span>
    </button>
    <button id="nav-people" onclick="showScreen('people')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      <span>Personen</span>
    </button>
    <button id="nav-ledger" onclick="showScreen('ledger')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
      <span>Soll/Ist</span>
    </button>
    <button id="nav-import" onclick="showScreen('import')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
      <span>Import</span>
    </button>
    <button id="nav-costs" onclick="showScreen('costs')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M14.5 8.5A3 3 0 0011.5 7H10a2 2 0 000 4h2a2 2 0 010 4h-1.5a3 3 0 01-3-1.5M12 5v14"/></svg>
      <span>Kosten</span>
    </button>
    <button id="nav-more" onclick="showScreen('more')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span>Mehr</span>
    </button>
  </nav>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
