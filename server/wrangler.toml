name = "finanzguru-push"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cron-Trigger: prüft viertelstündlich fällige Erinnerungen und sendet sie.
[triggers]
crons = ["*/15 * * * *"]

# KV-Namespace für die Abos (ID nach `wrangler kv namespace create SUBS` eintragen).
[[kv_namespaces]]
binding = "SUBS"
id = "8e0a20fa89ac4d4db138eff854901b3c"

[vars]
VAPID_SUBJECT = "mailto:info@arne-chudobba.de"
# Öffentlicher VAPID-Key (nicht geheim; identisch mit dem in der App eingetragenen).
VAPID_PUBLIC_KEY = "BIp4m1w4OIVYx3_yF_7eTWZGvjU3bhp5vvdCMpb7YaQmcdaMWoBuSQXyKZJEYQq9WZiRmjYqVu4DF-Wxy_qePLE"
