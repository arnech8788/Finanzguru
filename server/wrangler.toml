name = "finanzguru-push"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cron-Trigger: prüft viertelstündlich fällige Erinnerungen und sendet sie.
[triggers]
crons = ["*/15 * * * *"]

# KV-Namespace für die Abos (ID nach `wrangler kv namespace create SUBS` eintragen).
[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_KV_ID"

[vars]
VAPID_SUBJECT = "mailto:du@example.com"
# Öffentlicher VAPID-Key (nicht geheim; identisch mit dem in der App eingetragenen).
VAPID_PUBLIC_KEY = "REPLACE_WITH_VAPID_PUBLIC_KEY"
# Privater Key NICHT hier eintragen, sondern als Secret:
#   npx wrangler secret put VAPID_PRIVATE_KEY
